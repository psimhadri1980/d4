# D4 roadmap and dependency-risk metamodel. Designed from docs/roadmap-metamodel-requirements.md and
# docs/roadmap-metamodel-design.md (D99-D104). A standalone metamodel: it does not extend the starter.
#
# What the platform already provides and this model therefore does not define:
#   - business time on nodes and relationships (validFrom / validTo), so ownership, parentage and every
#     link are dated; "as of a date" views read these
#   - scenarios (scenarioId): what-if and named scenarios are overlays, never written to the main model
#   - record time and history (createdAt, updatedAt, the event log): baselines are named record times
# What is deliberately not stored: findings (non-conformance to firm direction), float, exposure and the
# risk signals. They are computed from this structure.
# Not expressible as rules here, checked by the risk signals instead: every node has an accountable owner
# (OWNED_BY), a use case's categories are satisfied by what serves it.
id: d4-roadmap
version: 0.1.0
description: "Roadmap, target and current landscape, data products, firm-wide direction, ownership and debt, for tracing roadmap risk through dependencies."

layers: [Strategy, Planning, Application, Data, Direction, Governance, Organisation]

enums:
  ElementLifecycle: [PLANNED, BUILDING, LIVE, PHASING_OUT, RETIRED]
  Confidence: [HIGH, MEDIUM, LOW]
  Strength: [HARD, SOFT]
  InitiativeLevel: [PORTFOLIO, INITIATIVE, SUB_INITIATIVE]
  InitiativeStatus: [PROPOSED, ACTIVE, ON_HOLD, DONE, CANCELLED]
  ApplicationKind: [APPLICATION, PLATFORM, COMPONENT, MODULE, AI_USE_CASE, AI_APP]
  DataProductLevel: [SOURCE_ALIGNED, AGGREGATE, CONSUMER_ALIGNED]
  ConstraintKind: [VENDOR, REGULATORY, FUNDING, CAPACITY]
  Stance: [ADOPT, TOLERATE, PHASE_OUT, RETIRE]
  RuleType: [MUST_USE, MUST_NOT_USE, MUST_FOLLOW, PRINCIPLE]
  DebtKind: [TECHNOLOGY, ARCHITECTURE, SYSTEM, DATA]
  DebtStatus: [IDENTIFIED, PLANNED, ACCEPTED, UNPLANNED, RESOLVED]
  Severity: [LOW, MEDIUM, HIGH, CRITICAL]
  OrgLevel: [GROUP, DIVISION, TOWER, STREAM, CREW]
  OwnerRole: [TECHNICAL, DATA_OWNER, STEWARD]

# Attributes every node carries. System fields (id, workspaceId, version, validFrom, validTo, scenarioId,
# audit fields) are managed by the platform. lastVerified and verifiedBy feed the stale-facts signal.
commonAttributes:
  - { name: name, type: string, required: true }
  - { name: description, type: text }
  - { name: lastVerified, type: date, description: "When someone last confirmed this fact." }
  - { name: verifiedBy, type: string }

nodeTypes:
  # ---- Strategy: the why ----
  - name: Objective
    layer: Strategy
    description: "An outcome that initiatives contribute to. Objectives nest through PART_OF."
    attributes:
      - { name: statement, type: text }
      - { name: period, type: string, description: "For example 2027-H1." }

  # ---- Planning: initiatives, milestones, needs ----
  - name: Initiative
    layer: Planning
    description: "A big rock, initiative or sub-initiative. Nests through PART_OF, so the roadmap reads at any level."
    attributes:
      - { name: level, type: enum, enum: InitiativeLevel }
      - { name: status, type: enum, enum: InitiativeStatus }
  - name: Epic
    layer: Planning
    description: "High-level scope of an initiative. The roadmap carries epics and milestones, not tasks."
    attributes:
      - { name: status, type: enum, enum: InitiativeStatus }
  - name: Milestone
    layer: Planning
    description: "A dated delivery point of an initiative or epic. Only committed milestones are the dates that matter for lateness."
    attributes:
      - { name: date, type: date, required: true }
      - { name: confidence, type: enum, enum: Confidence }
      - { name: committed, type: boolean }
  - name: UseCase
    layer: Planning
    description: "A business need, delivered by initiatives (REALISES) and served by elements (SERVES). It declares one or more categories."
    attributes:
      - { name: statement, type: text }
  - name: UseCaseCategory
    layer: Planning
    description: "A governed category of use cases (owned by the central teams). Blueprints apply to categories."
  - name: TransitionState
    layer: Planning
    description: "A named state of the landscape tied to a milestone. The long-term target is a transition state with target set."
    attributes:
      - { name: target, type: boolean }
  - name: Baseline
    layer: Planning
    description: "A named record time. Slip is the current forecast minus the same fact as recorded at this time. It copies no data."
    attributes:
      - { name: recordedAt, type: datetime, required: true }
      - { name: scope, type: string, description: "Portfolio or initiative the baseline covers." }
  - name: ExternalConstraint
    layer: Planning
    description: "A vendor, regulatory, funding or capacity constraint with a date. It gates milestones and elements like any other dependency."
    attributes:
      - { name: kind, type: enum, enum: ConstraintKind, required: true }
      - { name: constraintDate, type: date }

  # ---- Elements: what we build and what exists. One registry; current and target are views as of a date. ----
  - name: Element
    layer: Application
    description: "Common base of everything we build or run. One identity, one lifecycle. Current is live at a date, target is planned or live at a transition state."
    internal: true
    attributes:
      - { name: lifecycle, type: enum, enum: ElementLifecycle }
      - { name: plannedFrom, type: date }
      - { name: buildingFrom, type: date }
      - { name: liveFrom, type: date }
      - { name: phasingOutFrom, type: date }
      - { name: retiredFrom, type: date }
      - { name: central, type: boolean, description: "Owned by a central team and offered to others to build on (a shared platform)." }
  - name: ApplicationElement
    layer: Application
    extends: Element
    description: "An application, platform, component, module, AI use case or AI app. Composition through PART_OF."
    attributes:
      - { name: kind, type: enum, enum: ApplicationKind }
  - name: DataPlatform
    layer: Data
    extends: Element
    description: "A platform that hosts and serves data sets and data products."
  - name: DataSet
    layer: Data
    extends: Element
    description: "Data as it exists today, described as it is. Not forced into the data-product shape."
    attributes:
      - { name: major, type: boolean }
  - name: DataProduct
    layer: Data
    extends: Element
    description: "A domain-owned, consumer-facing data product. Composes other products through DERIVED_FROM. Consumers depend on its output ports."
    attributes:
      - { name: level, type: enum, enum: DataProductLevel }
      - { name: purpose, type: text }
  - name: OutputPort
    layer: Data
    extends: Element
    description: "The unit consumers depend on: an output port or contract of a data product. Part of the product (PART_OF)."
    attributes:
      - { name: contractVersion, type: string }
      - { name: sla, type: text }

  # ---- Direction: firm-wide architecture and technology direction, set by the central teams ----
  - name: Technology
    layer: Direction
    description: "A technology with three separate axes - the firm stance, the firm's own lifecycle dates, and the vendor's support dates. Risk uses the earliest binding date."
    attributes:
      - { name: stance, type: enum, enum: Stance }
      - { name: phaseOutFrom, type: date }
      - { name: retireBy, type: date }
      - { name: vendorEndOfSale, type: date }
      - { name: vendorEndOfSupport, type: date }
  - name: ReferenceArchitecture
    layer: Direction
    attributes:
      - { name: architectureVersion, type: string }
      - { name: documentUrl, type: url }
  - name: Principle
    layer: Direction
    attributes:
      - { name: statement, type: text }
      - { name: policyUrl, type: url }
  - name: Blueprint
    layer: Direction
    description: "An architecture or set of patterns a category of use cases must follow. A versioned set of typed rules."
    attributes:
      - { name: blueprintVersion, type: string }
  - name: BlueprintRule
    layer: Direction
    description: "One checkable rule of a blueprint. Conformance is assessed per rule; two rules that contradict are a conflict."
    attributes:
      - { name: ruleType, type: enum, enum: RuleType, required: true }
      - { name: graceUntil, type: date, description: "Rollout grace period; the rule is not enforced before this date." }

  # ---- Governance: debt and exceptions ----
  - name: DebtItem
    layer: Governance
    description: "Recorded debt, adopted from a computed finding or found by judgement. An accepted item is an exception and carries an expiry."
    attributes:
      - { name: kind, type: enum, enum: DebtKind, required: true }
      - { name: severity, type: enum, enum: Severity }
      - { name: status, type: enum, enum: DebtStatus, required: true }
      - { name: deadline, type: date, description: "The date by which it matters, for example an end-of-support date." }
      - { name: expiry, type: date, description: "Expiry of an accepted exception." }
      - { name: rationale, type: text }

  # ---- Organisation: ownership ----
  - name: OrgUnit
    layer: Organisation
    description: "A node of the organisation, Group to Crew. One parent at a time, dated through PART_OF."
    attributes:
      - { name: level, type: enum, enum: OrgLevel, required: true }
  - name: Domain
    layer: Organisation
    description: "A business area. Separate from the organisation; it sometimes coincides with a Tower or Stream."

relationshipTypes:
  # ---- Structure ----
  - name: PART_OF
    kind: containment
    forward: in
    description: "Child to parent - initiative trees, epics and milestones of an initiative, element composition, output ports of a product, objectives, the organisation."
    from: [Initiative, Epic, Milestone, Element, Objective, OrgUnit]
    to: [Initiative, Epic, Element, Objective, OrgUnit]
  - name: USES
    kind: dependency
    description: "Runtime dependency of one element on another."
    from: [Element]
    to: [Element]
    attributes:
      - { name: strength, type: enum, enum: Strength }
  - name: CONSUMES
    kind: dependency
    description: "A consumer depends on an output port, optionally at a contract version, not on the product as a whole."
    from: [Element]
    to: [OutputPort]
    attributes:
      - { name: strength, type: enum, enum: Strength }
      - { name: contractVersion, type: string }
  - name: PRODUCES
    kind: flow
    from: [Element]
    to: [DataSet, DataProduct]

  # ---- Change ----
  - name: DELIVERS
    description: "The epic or milestone that delivers an element. Sets the element's ready-by."
    from: [Epic, Milestone]
    to: [Element]
  - name: REPLACES
    description: "One element takes the place of another. Always between distinct elements."
    from: [Element]
    to: [Element]
  - name: WRAPS
    description: "One element fronts or encapsulates another."
    from: [Element]
    to: [Element]
  - name: RETIRES
    description: "An element's arrival ends another."
    from: [Element]
    to: [Element]
  - name: CONTRIBUTES_TO
    kind: association
    from: [Initiative]
    to: [Objective]
  - name: REALISES
    description: "An initiative delivers a use case (a business need)."
    from: [Initiative]
    to: [UseCase]
  - name: DEPENDS_ON
    kind: dependency
    description: "Planning dependency between initiatives or milestones."
    from: [Initiative, Milestone]
    to: [Initiative, Milestone]
    attributes:
      - { name: strength, type: enum, enum: Strength }
  - name: ADDRESSES
    description: "An initiative or epic that remediates a debt item."
    from: [Initiative, Epic]
    to: [DebtItem]
  - name: TIED_TO
    description: "The milestone at which a transition state is reached."
    from: [TransitionState]
    to: [Milestone]

  # ---- Conformance ----
  - name: BUILT_ON
    kind: dependency
    description: "An element is built on a firm-direction artefact or a shared platform. Divergence is computed as a finding."
    from: [Element]
    to: [Technology, ReferenceArchitecture, Element]
  - name: SERVES
    description: "An element serves a use case, so it inherits the blueprints of the use case's categories."
    from: [Element]
    to: [UseCase]
  - name: IN_CATEGORY
    kind: classification
    description: "A use case declares one or more categories."
    from: [UseCase]
    to: [UseCaseCategory]
  - name: GOVERNED_BY
    description: "A blueprint applies to a use-case category."
    from: [UseCaseCategory]
    to: [Blueprint]
  - name: HAS_RULE
    kind: containment
    from: [Blueprint]
    to: [BlueprintRule]
  - name: RULE_TARGETS
    description: "The technology, platform, reference architecture or principle a rule requires or forbids."
    from: [BlueprintRule]
    to: [Technology, Element, ReferenceArchitecture, Principle]

  # ---- Lineage and external ----
  - name: DERIVED_FROM
    kind: flow
    description: "Data flow only. It has no timing meaning; a product built from another also consumes its port."
    from: [DataSet, DataProduct]
    to: [DataSet, DataProduct]
  - name: GATED_BY
    kind: dependency
    description: "A milestone or element cannot be ready before an external constraint is met."
    from: [Milestone, Element]
    to: [ExternalConstraint]

  # ---- Debt ----
  - name: AFFECTS
    description: "The element a debt item applies to."
    from: [DebtItem]
    to: [Element]
  - name: FALLS_SHORT_OF
    description: "The standard or target a debt item falls short of."
    from: [DebtItem]
    to: [Technology, ReferenceArchitecture, Principle, Blueprint, BlueprintRule]

  # ---- Ownership ----
  - name: OWNED_BY
    kind: ownership
    forward: in
    description: "The accountable owner. Mandatory on every node; the validity period dates reorganisations."
    from: ['*']
    to: [OrgUnit]
  - name: ROLE_OWNED_BY
    kind: ownership
    forward: in
    description: "An optional role owner - technical owner, data owner or steward."
    from: ['*']
    to: [OrgUnit]
    attributes:
      - { name: role, type: enum, enum: OwnerRole, required: true }
  - name: IN_DOMAIN
    kind: classification
    description: "The business domain of a node. Independent of its organisational owner."
    from: ['*']
    to: [Domain]
  - name: ALIGNS_WITH
    kind: association
    description: "Optional mapping of a domain to the organisation unit it coincides with."
    from: [Domain]
    to: [OrgUnit]

rules:
  - { id: part-of-acyclic, kind: acyclic, relationship: PART_OF }
  - { id: depends-on-acyclic, kind: acyclic, relationship: DEPENDS_ON }
  - { id: derived-from-acyclic, kind: acyclic, relationship: DERIVED_FROM }
  - { id: replaces-acyclic, kind: acyclic, relationship: REPLACES }
