apiVersion: d4/v1
kind: Model
metadata:
  name: Alpenhof credit graph (illustrative)
  metamodel: d4-credit-graph@0.1.1
  description: >
    Sample credit book for a wealth-management bank on the d4-credit-graph metamodel pack: client groups
    and clients, credit facilities and drawdowns, collateral agreements pledging custody accounts and
    property, LTV and concentration covenants, margin calls, group, issuer, country and product limits,
    applications in the pipeline (planned), approvals, reviews, exposure, and the applications, controls
    and regulations around them.
  disclaimer: >
    Illustrative only. Alpenhof Private Bank AG, every client, issuer, instrument, property and figure
    are invented for demonstration; any resemblance to real persons or institutions is coincidental.

