# Weekly update pull requests. CI (affected-only checks plus the browser suite) gates each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  # The pnpm workspace (root lockfile). Minor and patch updates come grouped; majors one by one.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Playwright's npm packages must match the browsers in its image (apps/e2e, apps/renderer).
    # Dependabot cannot group across ecosystems, so bump all of them together by hand.
    ignore:
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core

  # Base images, pinned by digest in each Containerfile (tag kept for reading).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/renderer
      - /apps/ops
      - /apps/web
      - /apps/gateway
      - /apps/e2e
      - /deploy/web-modules
      - /deploy/test
      - /mocks/s3
      - /mocks/smtp
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ['*'] }
