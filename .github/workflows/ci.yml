name: ci
# A change to documentation only (docs, the user manual, Markdown) runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'user-manual/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'user-manual/**', '**/*.md']

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: d4, POSTGRES_PASSWORD: d4-local-dev, POSTGRES_DB: d4 }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U d4" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env: { NEO4J_AUTH: neo4j/d4-local-dev }
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p d4-local-dev 'RETURN 1'"
          --health-interval 10s --health-retries 30 --health-start-period 30s
    env:
      # Integration tests create throwaway databases / workspaces on these servers.
      D4_TEST_POSTGRES_URL: postgres://d4:d4-local-dev@localhost:5432/postgres
      D4_TEST_NEO4J_URL: bolt://localhost:7687
      D4_TEST_NEO4J_PASSWORD: d4-local-dev
      # Background jobs: the queue and the repository's own S3 mock (started below).
      D4_TEST_REDIS_URL: redis://localhost:6379
      D4_TEST_S3_ENDPOINT: http://localhost:8333
      # Pull requests check only the packages they change and their dependents (turbo --affected
      # compares with the base branch); pushes to main check everything. The turbo cache is kept
      # between runs, keyed by the test settings above, so unchanged packages replay.
      CHECK: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: S3 mock
        run: |
          pnpm turbo run build --filter @d4/mock-s3
          mkdir -p /tmp/s3
          S3_ACCESS_KEY=d4 S3_SECRET_KEY=d4-local-dev S3_MOCK_DATA_DIR=/tmp/s3 node mocks/s3/dist/main.js &
          for i in $(seq 30); do curl -fs http://localhost:8333/_health && break; sleep 1; done
      - run: pnpm turbo run build typecheck lint test $CHECK
      # Unused files, exports and dependencies need the whole repository.
      - run: pnpm knip
      # Every component.yaml against the contract, and the orchestrator's own types.
      - run: run/run.sh ls >/dev/null && pnpm exec tsc -p run/orchestrator/tsconfig.json
      # The committed SDK must match the API: regenerate it and fail on any difference.
      - name: SDK matches the API
        run: |
          pnpm turbo run build --filter @d4/api
          pnpm --filter @d4/sdk run generate
          git diff --exit-code -- packages/sdk

  # The browser suite against the stack (images built from this commit) on rootless Podman, on
  # the host network, as run/run.sh runs it locally.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Podman
        run: |
          podman version
          # The stack sets memory and CPU limits; rootless Podman needs those cgroup controllers delegated.
          cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers 2>/dev/null || echo "no user cgroup delegation"
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroup={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}}'
      - name: Doctor
        run: run/run.sh doctor
      - name: Stack (build, then start in dependency order; migrations and seed as hooks)
        run: run/run.sh podman:stack:deploy
      - name: Browser tests
        run: run/run.sh stack:test e2e -- --retries=1
      # Supply chain: an SBOM and a vulnerability report for each image this commit built.
      # Report only for now (no baseline yet); findings go to the job summary.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: success() || failure()
        with: { version: v0.76.1 }
      - name: Image scan and SBOM
        if: success() || failure()
        run: |
          mkdir -p sbom scan
          # One image per component, tagged with the hash of its inputs.
          for img in $(podman images --format '{{.Repository}}:{{.Tag}}' | grep '^localhost/d4-' | sort -u); do
            name=${img#localhost/}; name=${name%%:*}
            podman save -o "/tmp/$name.tar" "$img"
            trivy image --quiet --input "/tmp/$name.tar" --format cyclonedx --output "sbom/$name.cdx.json"
            trivy image --quiet --input "/tmp/$name.tar" --severity HIGH,CRITICAL --format json --output "scan/$name.json"
            trivy convert --format table --output "scan/$name.txt" "scan/$name.json"
            rm -f "/tmp/$name.tar"
          done
          {
            echo '## Image vulnerabilities'
            echo '| Image | Critical | High |'
            echo '|---|---:|---:|'
            for f in scan/*.json; do
              name=$(basename "$f" .json)
              c=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$f")
              h=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$f")
              echo "| $name | $c | $h |"
            done
            for f in scan/*.txt; do
              echo "<details><summary>$(basename "$f" .txt)</summary>"; echo; echo '```'; cat "$f"; echo '```'; echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: sbom-and-scan
          path: |
            sbom
            scan
          retention-days: 30
      - name: Service logs
        if: failure()
        run: |
          run/run.sh status || true
          run/run.sh stack:logs --no-follow -n 200 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            apps/e2e/results
            run/.run/logs
          retention-days: 7
