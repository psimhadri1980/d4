server {
  listen 8080;
  root /usr/share/nginx/html;

  # Written from the environment at start (config.sh); nginx runs unprivileged, so not in html/.
  location = /config.json {
    add_header Cache-Control "no-store";
    alias /tmp/d4/config.json;
  }
  # Hashed build assets can be cached forever; index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Client-side routes (/w/..., /callback) all serve the app shell.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
