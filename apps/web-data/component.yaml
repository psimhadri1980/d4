# yaml-language-server: $schema=../../run/schema/component.schema.json
apiVersion: d4/v1
kind: Component
name: web-data
category: ui
description: "Lifecycle module: Data management (import, export, connectors, editor). In Podman it is served by ui-modules"
source: '@d4/web-data'
optional: true
ports: { http: 8094 }
health: { http: /mfe/data/data.js, timeout: 120 }
route: /mfe/data/
runtimes:
  default: podman
  # A watch build served under /mfe/data/; the gateway routes there while it runs, else to ui-modules.
  local:
    build: full
    command: 'pnpm --filter @d4/web-data exec vite build --watch --emptyOutDir false --logLevel warn & pnpm --filter @d4/web-data exec vite preview --host 127.0.0.1 --port ${PORT_WEB_DATA} --strictPort --base /mfe/data/'
  podman: { via: ui-modules }
test:
  e2e: [tests/import.spec.ts, tests/exports.spec.ts, tests/connectors.spec.ts, tests/editor.spec.ts]