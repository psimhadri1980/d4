server {
  listen 8080;
  root /usr/share/nginx/html;
  # The entry and manifest name the current chunks: never cache them. Chunks are content-hashed.
  location ~ ^/mfe/admin/(remoteEntry\.js|mf-manifest\.json)$ { add_header Cache-Control "no-cache"; }
  location /mfe/admin/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
