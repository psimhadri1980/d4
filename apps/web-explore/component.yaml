# yaml-language-server: $schema=../../run/schema/component.schema.json
apiVersion: d4/v1
kind: Component
name: web-explore
category: ui
description: "Lifecycle module: Explore (catalog, explorer, relationships). In Podman it is served by ui-modules"
source: '@d4/web-explore'
optional: true
ports: { http: 8091 }
health: { http: /mfe/explore/explore.js, timeout: 120 }
route: /mfe/explore/
runtimes:
  default: podman
  # A watch build served under /mfe/explore/; the gateway routes there while it runs, else to ui-modules.
  local:
    build: full
    command: 'pnpm --filter @d4/web-explore exec vite build --watch --emptyOutDir false --logLevel warn & pnpm --filter @d4/web-explore exec vite preview --host 127.0.0.1 --port ${PORT_WEB_EXPLORE} --strictPort --base /mfe/explore/'
  podman: { via: ui-modules }
test:
  e2e: [tests/explorer.spec.ts, tests/graph-studio.spec.ts, tests/lens-shapes.spec.ts, tests/catalog.spec.ts, tests/relationships.spec.ts, tests/viewer.spec.ts]