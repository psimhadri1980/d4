# yaml-language-server: $schema=../../run/schema/component.schema.json
apiVersion: d4/v1
kind: Component
name: web-queries
category: ui
description: "Lifecycle module: Queries and insights. In Podman it is served by ui-modules"
source: '@d4/web-queries'
optional: true
ports: { http: 8092 }
health: { http: /mfe/queries/queries.js, timeout: 120 }
route: /mfe/queries/
runtimes:
  default: podman
  # A watch build served under /mfe/queries/; the gateway routes there while it runs, else to ui-modules.
  local:
    build: full
    command: 'pnpm --filter @d4/web-queries exec vite build --watch --emptyOutDir false --logLevel warn & pnpm --filter @d4/web-queries exec vite preview --host 127.0.0.1 --port ${PORT_WEB_QUERIES} --strictPort --base /mfe/queries/'
  podman: { via: ui-modules }
test:
  e2e: [tests/insights.spec.ts]