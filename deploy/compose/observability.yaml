# Optional tracing and metrics (profile `observability`, `dev-infra.sh up --obs`).
services:
  otel-collector:
    profiles: [observability]
    image: ${OTEL_COLLECTOR_IMAGE}
    ports: ['127.0.0.1:4317:4317', '127.0.0.1:4318:4318']
    volumes:
      - ../otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    mem_limit: 192m

  tempo:
    profiles: [observability]
    image: ${TEMPO_IMAGE}
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ../otel/tempo.yaml:/etc/tempo.yaml:ro,Z
      - tempo-data:/var/tempo
    mem_limit: 256m

  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE}
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ../otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro,Z
    mem_limit: 256m

  grafana:
    profiles: [observability]
    image: ${GRAFANA_IMAGE}
    environment:
      # Behind the gateway at <D4_PUBLIC_URL>/grafana/.
      GF_SERVER_ROOT_URL: ${D4_PUBLIC_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run through deploy/dev-infra.sh}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro,Z
    mem_limit: 256m

volumes:
  tempo-data:
