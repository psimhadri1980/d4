# D4 services. See infra.yaml for how the files combine.
x-app-env: &app-env
  env_file:
    - ../env/common.env
    - ../env/container.env
    - ../env/dev-secrets.env
    - { path: ../env/local.env, required: false }

x-ready: &after-init
  neo4j-schema: { condition: service_completed_successfully }
  redis: { condition: service_healthy }
  s3: { condition: service_healthy }

services:
  api:
    build: { context: ../.., dockerfile: apps/api/Containerfile }
    image: localhost/d4-api:local
    volumes: ['../secrets:/run/d4-secrets:ro,z']
    <<: *app-env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${D4_OTEL_ENDPOINT:-}
    depends_on:
      <<: *after-init
      keycloak: { condition: service_healthy }
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz >/dev/null']
      interval: 10s
      retries: 6

  worker:
    build: { context: ../.., dockerfile: apps/worker/Containerfile }
    image: localhost/d4-worker:local
    volumes: ['../secrets:/run/d4-secrets:ro,z']
    <<: *app-env
    environment:
      WORKER_CONCURRENCY: 2
      OTEL_EXPORTER_OTLP_ENDPOINT: ${D4_OTEL_ENDPOINT:-}
    depends_on:
      <<: *after-init
      smtp: { condition: service_healthy }
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/healthz >/dev/null']
      interval: 10s
      retries: 6

  renderer:
    build: { context: ../.., dockerfile: apps/renderer/Containerfile }
    image: localhost/d4-renderer:local
    volumes: ['../secrets:/run/d4-secrets:ro,z']
    <<: *app-env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${D4_OTEL_ENDPOINT:-}
    depends_on:
      <<: *after-init
      smtp: { condition: service_healthy }
    # Chromium: memory for one render at a time (RENDER_CONCURRENCY=1).
    mem_limit: 768m
    cpus: 1.0
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      # The Playwright image has neither wget nor curl. No spaces: Podman splits the argument on them.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 6
