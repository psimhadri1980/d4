server {
  listen 8080;
  root /usr/share/nginx/html;
  # Module entries and stylesheets keep their names across releases: never cache them. Chunks are content-hashed.
  location ~ ^/mfe/[^/]+/[^/]+\.(js|css)$ { add_header Cache-Control "no-cache"; }
  location ~ ^/mfe/[^/]+/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
