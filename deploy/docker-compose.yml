# Local D4 stack. Sized for an 8 GB machine (~3.3 GB caps for the core profile).
#   core (default):  neo4j, postgres, redis, s3 (SeaweedFS), keycloak
#                    + init jobs (db-migrate, neo4j-schema, s3-init) + api + web (:5173)
#   observability:   otel-collector, tempo, prometheus, grafana   (--profile observability)
#   tools:           test runner                                  (--profile tools)
# Use deploy/dev.sh rather than calling compose directly.
name: d4

x-api-env: &api-env
  API_PORT: 3000
  POSTGRES_URL: postgres://d4:d4-local-dev@postgres:5432/d4
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: d4-local-dev
  # Tokens are issued for the browser-facing URL; keys are fetched over the compose network.
  OIDC_ISSUER: http://localhost:8080/realms/d4
  OIDC_JWKS_URI: http://keycloak:8080/realms/d4/protocol/openid-connect/certs
  OIDC_AUDIENCE: d4-api
  OTEL_EXPORTER_OTLP_ENDPOINT: ${D4_OTEL_ENDPOINT:-}

services:
  # ── Data stores ───────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    ports: ['7474:7474', '7687:7687']
    environment:
      NEO4J_AUTH: neo4j/d4-local-dev
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,gds.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*,gds.*'
      NEO4J_db_transaction_timeout: 30s
      # Heap + page cache + capped transaction memory, leaving ~600 MB for JVM/Lucene overhead.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 640m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_memory_transaction_total_max: 256m
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
    mem_limit: 1800m
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p d4-local-dev "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: d4
      POSTGRES_PASSWORD: d4-local-dev
      POSTGRES_DB: d4
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U d4 -d d4']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '96mb', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # S3-compatible object store (MinIO no longer publishes container images).
  s3:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=128 -volume.max=20
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['8333:8333']
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1']
      interval: 5s
      retries: 30

  # ── Identity ──────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    ports: ['8080:8080']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: d4-local-dev
      KC_HEALTH_ENABLED: 'true'
      # Fixed public issuer; containers may still call keycloak:8080 on the back channel.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60
    volumes:
      - ./keycloak/d4-realm.json:/opt/keycloak/data/import/d4-realm.json:ro
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      retries: 30
      start_period: 30s

  # ── One-shot init jobs ───────────────────────────────────────────────
  s3-init:
    image: amazon/aws-cli:2.17.40
    depends_on: { s3: { condition: service_healthy } }
    environment:
      AWS_ACCESS_KEY_ID: d4
      AWS_SECRET_ACCESS_KEY: d4-local-dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c 'for b in d4-exports d4-attachments d4-backups; do
               aws --endpoint-url http://s3:8333 s3api head-bucket --bucket $$b 2>/dev/null ||
               aws --endpoint-url http://s3:8333 s3 mb s3://$$b || exit 1;
             done'
    restart: 'no'

  # Applies control-plane migrations, then seeds the local tenant, metamodel and workspace.
  db-migrate:
    build: { context: .., dockerfile: Dockerfile, target: api }
    image: d4-api:local
    depends_on:
      postgres: { condition: service_healthy }
    environment: *api-env
    working_dir: /repo/packages/db
    command: ['node', 'dist/seed-local.js']
    restart: 'no'

  neo4j-schema:
    build: { context: .., dockerfile: Dockerfile, target: api }
    image: d4-api:local
    depends_on:
      neo4j: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    environment: *api-env
    command: ['node', 'dist/scripts/apply-schema.js', 't_local']
    restart: 'no'

  # ── Application ───────────────────────────────────────────────────────
  api:
    image: d4-api:local
    build: { context: .., dockerfile: Dockerfile, target: api }
    ports: ['3000:3000']
    environment: *api-env
    depends_on:
      neo4j-schema: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    mem_limit: 384m
    cpus: 1.0

  web:
    build: { context: .., dockerfile: Dockerfile, target: web }
    image: d4-web:local
    ports: ['5173:80']
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 64m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 10s
      retries: 6

  # ── Observability (optional) ─────────────────────────────────────────
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.108.0
    ports: ['4317:4317', '4318:4318']
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 192m

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.5.0
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 256m

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    ports: ['9090:9090']
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.0
    ports: ['3001:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: d4-local-dev
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    mem_limit: 256m

  # ── Tools ─────────────────────────────────────────────────────────────
  test:
    profiles: [tools]
    build: { context: .., dockerfile: Dockerfile, target: test }
    image: d4-test:local
    # Capped, with at most two suites at a time, so tests don't starve Neo4j on a 4 GB Docker VM.
    command: ['pnpm', 'turbo', 'run', 'test', '--concurrency=2']
    mem_limit: 1536m
    cpus: 2.0
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    environment:
      # Integration tests create and drop their own throwaway databases on this server.
      D4_TEST_POSTGRES_URL: postgres://d4:d4-local-dev@postgres:5432/postgres
      # Graph tests use a throwaway workspace on the dev Neo4j and delete it afterwards.
      D4_TEST_NEO4J_URL: bolt://neo4j:7687
      D4_TEST_NEO4J_PASSWORD: d4-local-dev

  # Browser tests against the running stack: deploy/dev.sh e2e
  e2e:
    profiles: [tools]
    build: { context: .., dockerfile: Dockerfile, target: e2e }
    image: d4-e2e:local
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - ../apps/e2e/results:/repo/apps/e2e/results
    shm_size: 1gb

volumes:
  neo4j-data:
  neo4j-plugins:
  pg-data:
  redis-data:
  s3-data:
  tempo-data:
