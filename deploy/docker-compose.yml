# Local D4 stack. Sized for an 8 GB machine (~3.3 GB caps for the core profile).
#   core (default):  neo4j, postgres, redis, keycloak, s3 and smtp (in-repo mocks, mocks/*)
#                    + init jobs (db-migrate, neo4j-schema) + api + worker + renderer + web (:5173)
#   observability:   otel-collector, tempo, prometheus, grafana   (--profile observability)
#   tools:           test runner, browser tests                   (--profile tools)
# Settings come from deploy/env/*.env: services read them with env_file, and compose fills
# ${...} below from the --env-file arguments deploy/dev.sh passes. Use deploy/dev.sh rather
# than calling compose directly.
name: d4

# What the D4 services read (later files win; local.env is optional and git-ignored).
x-app-env: &app-env
  env_file:
    - env/common.env
    - env/container.env
    - env/dev-secrets.env
    - { path: env/local.env, required: false }

services:
  # ── Data stores ───────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    ports: ['7474:7474', '7687:7687']
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run through deploy/dev.sh}
      # APOC only: nothing uses Graph Data Science, and it costs several hundred MB of class metadata.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*'
      NEO4J_db_transaction_timeout: 30s
      # Keep transaction logs small: after a crash Neo4j replays them on start, and 500 MB of logs made
      # recovery itself run out of memory. D4 backups come from the event log, not from these.
      NEO4J_db_tx__log_rotation_retention__policy: '100M size'
      # Sized for an 8 GB laptop running the whole stack: every JVM memory area is capped, so the
      # total stays well inside mem_limit (heap 512 + page cache 128 + direct 128 + metaspace 256 +
      # code cache 64 MB, plus threads and native). A 384 MB heap gave multi-second GC pauses when
      # several test suites imported at once.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_db_memory_transaction_total_max: 128m
      NEO4J_server_jvm_additional: '-XX:MaxDirectMemorySize=128m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -Xss512k'
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
    mem_limit: 1400m
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run through deploy/dev.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run through deploy/dev.sh}
      POSTGRES_DB: ${POSTGRES_DB:?run through deploy/dev.sh}
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '96mb', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # S3 for local development: the file-backed mock in mocks/s3 (S3 REST and SigV4, buckets
  # from S3_MOCK_BUCKETS created at start, so no bucket job is needed).
  s3:
    build: { context: .., dockerfile: Dockerfile, target: mock-s3 }
    image: d4-mock-s3:local
    ports: ['8333:8333']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run through deploy/dev.sh}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run through deploy/dev.sh}
      S3_MOCK_BUCKETS: ${S3_MOCK_BUCKETS:-d4-exports}
    volumes:
      - s3-mock-data:/data
    mem_limit: 128m

  # Catches report emails locally (mocks/smtp); nothing leaves the machine. Inbox: http://localhost:8025
  smtp:
    build: { context: .., dockerfile: Dockerfile, target: mock-smtp }
    image: d4-mock-smtp:local
    ports: ['8025:8025', '1025:1025']
    mem_limit: 64m

  # ── Identity ──────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    ports: ['8080:8080']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run through deploy/dev.sh}
      KC_HEALTH_ENABLED: 'true'
      # Fixed public issuer; containers may still call keycloak:8080 on the back channel.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?run through deploy/dev.sh}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60
      # Placeholders in the realm file (read on first import only).
      D4_PUBLIC_URL: ${D4_PUBLIC_URL:?run through deploy/dev.sh}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:?run through deploy/dev.sh}
    volumes:
      - ./keycloak/d4-realm.json:/opt/keycloak/data/import/d4-realm.json:ro
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      retries: 30
      start_period: 30s

  # ── One-shot init jobs ───────────────────────────────────────────────
  # Applies control-plane migrations, then seeds the local tenant, metamodel and workspace.
  db-migrate:
    build: { context: .., dockerfile: Dockerfile, target: api }
    image: d4-api:local
    volumes: ['./secrets:/run/d4-secrets:ro']
    depends_on:
      postgres: { condition: service_healthy }
    <<: *app-env
    working_dir: /repo/packages/db
    command: ['node', 'dist/seed-local.js']
    restart: 'no'

  neo4j-schema:
    build: { context: .., dockerfile: Dockerfile, target: api }
    image: d4-api:local
    depends_on:
      neo4j: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    <<: *app-env
    command: ['node', 'dist/scripts/apply-schema.js', 't_local']
    restart: 'no'

  # ── Application ───────────────────────────────────────────────────────
  api:
    image: d4-api:local
    volumes: ['./secrets:/run/d4-secrets:ro']
    build: { context: .., dockerfile: Dockerfile, target: api }
    ports: ['3000:3000']
    <<: *app-env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${D4_OTEL_ENDPOINT:-}
    depends_on:
      neo4j-schema: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    mem_limit: 384m
    cpus: 1.0

  worker:
    build: { context: .., dockerfile: Dockerfile, target: worker }
    image: d4-worker:local
    volumes: ['./secrets:/run/d4-secrets:ro']
    <<: *app-env
    environment:
      WORKER_CONCURRENCY: 2
    depends_on:
      smtp: { condition: service_healthy }
      neo4j-schema: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped

  renderer:
    build: { context: .., dockerfile: Dockerfile, target: renderer }
    image: d4-renderer:local
    volumes: ['./secrets:/run/d4-secrets:ro']
    <<: *app-env
    depends_on:
      smtp: { condition: service_healthy }
      neo4j-schema: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    # Chromium: memory for one render at a time (RENDER_CONCURRENCY=1).
    mem_limit: 768m
    cpus: 1.0
    shm_size: 256m
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: Dockerfile, target: web }
    image: d4-web:local
    ports: ['5173:80']
    # Written to /config.json at start (deploy/web/config.sh): public values only.
    environment:
      D4_PUBLIC_API_URL: ${D4_PUBLIC_API_URL:?run through deploy/dev.sh}
      OIDC_ISSUER: ${OIDC_ISSUER:?run through deploy/dev.sh}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?run through deploy/dev.sh}
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 64m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 10s
      retries: 6

  # ── Observability (optional) ─────────────────────────────────────────
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.108.0
    ports: ['4317:4317', '4318:4318']
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 192m

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.5.0
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 256m

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    ports: ['9090:9090']
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.0
    ports: ['3001:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run through deploy/dev.sh}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    mem_limit: 256m

  # ── Tools ─────────────────────────────────────────────────────────────
  test:
    profiles: [tools]
    build: { context: .., dockerfile: Dockerfile, target: test }
    image: d4-test:local
    # Capped, with at most two suites at a time, so tests don't starve Neo4j on a 4 GB Docker VM.
    command: ['pnpm', 'turbo', 'run', 'test', '--concurrency=2']
    mem_limit: 1536m
    cpus: 2.0
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      # Integration tests create and drop their own throwaway databases on this server.
      D4_TEST_POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      # Graph tests use a throwaway workspace on the dev Neo4j and delete it afterwards.
      D4_TEST_NEO4J_URL: bolt://neo4j:7687
      D4_TEST_NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Job tests use their own queue name prefix and bucket keys, and clean up.
      D4_TEST_REDIS_URL: redis://redis:6379
      D4_TEST_S3_ENDPOINT: http://s3:8333

  # Browser tests against the running stack: deploy/dev.sh e2e
  e2e:
    profiles: [tools]
    build: { context: .., dockerfile: Dockerfile, target: e2e }
    image: d4-e2e:local
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - ../apps/e2e/results:/repo/apps/e2e/results
    shm_size: 1gb

volumes:
  neo4j-data:
  neo4j-plugins:
  pg-data:
  redis-data:
  s3-mock-data:
  tempo-data:
