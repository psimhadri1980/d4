# Local development infrastructure for D4.
# One Neo4j Community instance stands in for a single tenant database.
name: d4

services:
  neo4j:
    image: neo4j:5.26-community
    ports: ['7474:7474', '7687:7687']
    environment:
      NEO4J_AUTH: neo4j/d4-local-dev
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,gds.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*,gds.*'
      NEO4J_db_transaction_timeout: 30s
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7474 || exit 1']
      interval: 10s
      retries: 12

  postgres:
    image: postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: d4
      POSTGRES_PASSWORD: d4-local-dev
      POSTGRES_DB: d4
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U d4']
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    ports: ['9000:9000', '9001:9001']
    environment:
      MINIO_ROOT_USER: d4
      MINIO_ROOT_PASSWORD: d4-local-dev
    volumes:
      - minio-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    ports: ['8080:8080']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: d4-local-dev
    volumes:
      - ./keycloak/d4-realm.json:/opt/keycloak/data/import/d4-realm.json:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    ports: ['4317:4317', '4318:4318']
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  neo4j-data:
  pg-data:
  minio-data:
