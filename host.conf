# The one browser-facing entry point of this deployment: the gateway (always in Podman) listens
# here and every URL is derived from these values by run/run.sh (D4_PUBLIC_URL, the API at /api,
# Keycloak at /auth, OIDC_ISSUER, Keycloak's redirect URIs, Grafana's root URL).
# Flat KEY=value lines. Override per machine in run/env/local.env (git-ignored).
D4_SCHEME=http
D4_HOST=localhost
D4_PORT=5173
# HTTPS port, used when run/certs/gateway.crt and gateway.key exist (see run/certs/README.md).
D4_TLS_PORT=5443
# Address the gateway binds: 127.0.0.1 keeps it on this machine; 0.0.0.0 serves the network.
D4_BIND=127.0.0.1
